<style>
/* Fonts: self-hosted latin subsets (Fontsource), per design-system decision 0002. */
@font-face{font-family:'Instrument Sans Variable';font-style:normal;font-display:swap;font-weight:400 700;src:url(/v/fonts/instrument-sans-latin-wght-normal.woff2) format('woff2-variations')}
@font-face{font-family:'Inter Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url(/v/fonts/inter-latin-wght-normal.woff2) format('woff2-variations')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-display:swap;font-weight:400;src:url(/v/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
/* Tokens: values mirror @mantias-dev/tokens semantic.css (this page is static and cannot import the private package). */
:root{color-scheme:light;
--mantias-font-display:'Instrument Sans Variable',ui-sans-serif,system-ui,sans-serif;
--mantias-font-body:'Inter Variable',ui-sans-serif,system-ui,sans-serif;
--mantias-font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
--mantias-color-surface-page:#f4f5f2;--mantias-color-surface-card:#fff;--mantias-color-surface-ink:#04203e;
--mantias-color-ink:#04203e;--mantias-color-ink-soft:#46586b;--mantias-color-ink-faint:#8593a1;--mantias-color-on-ink:#f4f5f2;
--mantias-color-accent:#1f9d94;--mantias-color-hairline:#dbe0e4;
--mantias-shadow-figure:0 24px 60px -32px rgba(4,32,62,.35);
--mantias-button-bg:#04203e;--mantias-button-fg:#fff;--mantias-focus-ring:#1f9d94;--mantias-selection-bg:#04203e;--mantias-selection-fg:#f4f5f2;
--mantias-ease-out:cubic-bezier(.22,1,.36,1);--mantias-duration-base:200ms}
[data-theme='dark']{color-scheme:dark;
--mantias-color-surface-page:#242c33;--mantias-color-surface-card:#1b2329;--mantias-color-surface-ink:#e9edf0;
--mantias-color-ink:#e9edf0;--mantias-color-ink-soft:#b2bbc2;--mantias-color-ink-faint:#848e97;--mantias-color-on-ink:#242c33;
--mantias-color-accent:#58c8be;--mantias-color-hairline:#3a444c;
--mantias-button-bg:#e9edf0;--mantias-button-fg:#1b2329;--mantias-focus-ring:#58c8be;--mantias-selection-bg:#e9edf0;--mantias-selection-fg:#1b2329}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){color-scheme:dark;
--mantias-color-surface-page:#242c33;--mantias-color-surface-card:#1b2329;--mantias-color-surface-ink:#e9edf0;
--mantias-color-ink:#e9edf0;--mantias-color-ink-soft:#b2bbc2;--mantias-color-ink-faint:#848e97;--mantias-color-on-ink:#242c33;
--mantias-color-accent:#58c8be;--mantias-color-hairline:#3a444c;
--mantias-button-bg:#e9edf0;--mantias-button-fg:#1b2329;--mantias-focus-ring:#58c8be;--mantias-selection-bg:#e9edf0;--mantias-selection-fg:#1b2329}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mantias-color-surface-page);color:var(--mantias-color-ink)}
body{font-family:var(--mantias-font-body);font-size:.95rem;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
::selection{background:var(--mantias-selection-bg);color:var(--mantias-selection-fg)}
:focus-visible{outline:2px solid var(--mantias-focus-ring);outline-offset:2px}
[hidden]{display:none!important}
main{width:100%;max-width:420px}
.brand{display:flex;align-items:center;margin:0 0 20px}
.wordmark{display:inline-flex;align-items:center;color:var(--mantias-color-ink);padding:6px 0}
.wordmark svg{height:22px;width:auto;fill:currentColor;display:block}
.card{background:var(--mantias-color-surface-card);border:1px solid var(--mantias-color-hairline);border-radius:0;box-shadow:var(--mantias-shadow-figure);padding:28px 24px}
.label{font-family:var(--mantias-font-mono);font-size:.75rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--mantias-color-ink-faint);margin:0 0 14px}
h1{font-family:var(--mantias-font-display);font-size:1.75rem;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:0;overflow-wrap:anywhere}
.role{margin:6px 0 0;font-size:1.0625rem;line-height:1.35;color:var(--mantias-color-ink-soft);overflow-wrap:anywhere}
.rows{display:grid;gap:1px;background:var(--mantias-color-hairline);border-top:1px solid var(--mantias-color-hairline);border-bottom:1px solid var(--mantias-color-hairline);margin:22px 0 0;padding:0}
.rows:empty{display:none}
.row{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:baseline;background:var(--mantias-color-surface-card);padding:11px 0;margin:0}
.row dt{font-family:var(--mantias-font-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mantias-color-ink-faint)}
.row dd{margin:0;font-size:1.0625rem;line-height:1.35;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;white-space:pre-line}
.row a{color:var(--mantias-color-ink);text-decoration:none;transition:color var(--mantias-duration-base) var(--mantias-ease-out)}
.row a:hover,.row a:active{color:var(--mantias-color-accent)}
.add{display:inline-flex;width:100%;align-items:center;justify-content:center;gap:8px;margin:24px 0 0;padding:.875rem 1.5rem;min-height:48px;border:0;border-radius:0;background:var(--mantias-button-bg);color:var(--mantias-button-fg);font-family:var(--mantias-font-body);font-size:1rem;font-weight:600;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;transition:transform var(--mantias-duration-base) var(--mantias-ease-out)}
.add:hover{transform:translateY(-2px)}
.add .glyph{transition:transform var(--mantias-duration-base) var(--mantias-ease-out)}
.add:hover .glyph{transform:translateX(2px)}
.status{margin:14px 0 0;font-size:.8125rem;line-height:1.5;color:var(--mantias-color-ink-soft);text-align:center;min-height:1.5em}
.fallback{display:block;margin:6px 0 0;font-size:.8125rem;color:var(--mantias-color-ink-soft);text-align:center;text-decoration:underline;text-underline-offset:2px;transition:color var(--mantias-duration-base) var(--mantias-ease-out)}
.fallback:hover{color:var(--mantias-color-ink)}
.empty{margin:0;font-size:1.0625rem;color:var(--mantias-color-ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>

    </a>

  <section id="card" class="card" hidden>
